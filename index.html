<!DOCTYPE html>
<html lang="zh-TW">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>NutriTrack AI</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <script src="https://cdn.jsdelivr.net/npm/chart.js"></script>
    <link href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0/css/all.min.css" rel="stylesheet">
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700&display=swap" rel="stylesheet">
    <style>
        body { font-family: 'Inter', sans-serif; }
        .hidden { display: none !important; }
        .progress-bar-transition { transition: width 0.5s ease-in-out; }
    </style>
</head>
<body class="bg-gray-50 text-gray-800 antialiased min-h-screen flex flex-col">

    <!-- Navigation Bar -->
    <nav class="bg-emerald-600 text-white shadow-lg sticky top-0 z-40">
        <div class="max-w-7xl mx-auto px-4 sm:px-6 lg:px-8">
            <div class="flex justify-between h-16">
                <div class="flex items-center">
                    <i class="fa-solid fa-leaf text-2xl mr-2"></i>
                    <span class="font-bold text-xl tracking-tight" data-i18n="appTitle">NutriTrack AI</span>
                </div>
                <div class="flex items-center space-x-4">
                    <button id="navDashboard" class="hover:bg-emerald-700 px-3 py-2 rounded-md font-medium transition" onclick="switchView('dashboard')" data-i18n="dashboard">Dashboard</button>
                    <button id="navSettings" class="hover:bg-emerald-700 px-3 py-2 rounded-md font-medium transition" onclick="switchView('settings')" data-i18n="settings">Settings</button>
                    <select id="langSelect" class="bg-emerald-700 text-white border-none rounded p-1 ml-2 text-sm focus:ring-0 cursor-pointer" onchange="changeLanguage(this.value)">
                        <option value="zh-TW">繁體中文</option>
                        <option value="en">English</option>
                    </select>
                </div>
            </div>
        </div>
    </nav>

    <!-- Main Content Area -->
    <main class="flex-grow max-w-7xl mx-auto px-4 sm:px-6 lg:px-8 py-8 w-full">

        <!-- Dashboard View -->
        <div id="viewDashboard" class="hidden space-y-6">
            
            <div class="grid grid-cols-1 md:grid-cols-3 gap-6">
                <!-- Calorie Chart Card -->
                <div class="bg-white rounded-2xl shadow-sm border border-gray-100 p-6 md:col-span-1 flex flex-col items-center justify-center">
                    <h3 class="text-lg font-semibold mb-4 text-gray-700" data-i18n="calories">Calories</h3>
                    <div class="relative w-48 h-48">
                        <canvas id="calorieChart"></canvas>
                        <div class="absolute inset-0 flex flex-col items-center justify-center pointer-events-none">
                            <span id="calsConsumedText" class="text-2xl font-bold text-emerald-600">0</span>
                            <span class="text-xs text-gray-400" data-i18n="kcal">kcal</span>
                        </div>
                    </div>
                    <div class="mt-4 text-sm text-gray-500 text-center">
                        <span data-i18n="target">Target</span>: <span id="calsTargetText" class="font-semibold text-gray-700">0</span> <span data-i18n="kcal">kcal</span>
                    </div>
                </div>

                <!-- Macros Progress Bars Card -->
                <div class="bg-white rounded-2xl shadow-sm border border-gray-100 p-6 md:col-span-2 flex flex-col justify-center space-y-6">
                    <h3 class="text-lg font-semibold text-gray-700" data-i18n="macros">Macronutrients</h3>
                    
                    <!-- Carbs -->
                    <div>
                        <div class="flex justify-between text-sm mb-1">
                            <span class="font-medium text-gray-600" data-i18n="carbs">Carbs</span>
                            <span class="text-gray-500"><span id="carbsConsumed">0</span>g / <span id="carbsTarget">0</span>g</span>
                        </div>
                        <div class="w-full bg-gray-100 rounded-full h-3">
                            <div id="barCarbs" class="bg-blue-400 h-3 rounded-full progress-bar-transition" style="width: 0%"></div>
                        </div>
                    </div>

                    <!-- Protein -->
                    <div>
                        <div class="flex justify-between text-sm mb-1">
                            <span class="font-medium text-gray-600" data-i18n="protein">Protein</span>
                            <span class="text-gray-500"><span id="proteinConsumed">0</span>g / <span id="proteinTarget">0</span>g</span>
                        </div>
                        <div class="w-full bg-gray-100 rounded-full h-3">
                            <div id="barProtein" class="bg-red-400 h-3 rounded-full progress-bar-transition" style="width: 0%"></div>
                        </div>
                    </div>

                    <!-- Fat -->
                    <div>
                        <div class="flex justify-between text-sm mb-1">
                            <span class="font-medium text-gray-600" data-i18n="fat">Fat</span>
                            <span class="text-gray-500"><span id="fatConsumed">0</span>g / <span id="fatTarget">0</span>g</span>
                        </div>
                        <div class="w-full bg-gray-100 rounded-full h-3">
                            <div id="barFat" class="bg-yellow-400 h-3 rounded-full progress-bar-transition" style="width: 0%"></div>
                        </div>
                    </div>
                </div>
            </div>

            <!-- Meal Upload and List Section -->
            <div class="bg-white rounded-2xl shadow-sm border border-gray-100 p-6">
                <div class="flex justify-between items-center mb-4 border-b pb-4">
                    <h3 class="text-lg font-semibold text-gray-700" data-i18n="todaysMeals">Today's Meals</h3>
                    <div class="relative">
                        <input type="file" id="mealImageInput" accept="image/*" class="hidden" onchange="handleImageUpload(event)">
                        <button onclick="document.getElementById('mealImageInput').click()" class="bg-emerald-100 text-emerald-700 hover:bg-emerald-200 px-4 py-2 rounded-lg font-medium transition flex items-center shadow-sm">
                            <i class="fa-solid fa-camera mr-2"></i> <span data-i18n="addMeal">Add Meal</span>
                        </button>
                    </div>
                </div>

                <!-- Loading Indicator -->
                <div id="aiLoadingIndicator" class="hidden p-4 text-center">
                    <i class="fa-solid fa-spinner fa-spin text-emerald-500 text-2xl mb-2"></i>
                    <p class="text-gray-500 text-sm" data-i18n="analyzing">Analyzing food with AI...</p>
                </div>

                <div id="mealList" class="space-y-4">
                    <!-- Meal items will be injected here via JS -->
                </div>
                
                <div id="emptyMealState" class="text-center py-10 text-gray-400">
                    <i class="fa-solid fa-utensils text-4xl mb-3 opacity-50"></i>
                    <p data-i18n="noMeals">No meals logged yet. Upload a photo to start!</p>
                </div>
            </div>
        </div>

        <!-- Settings View -->
        <div id="viewSettings" class="hidden max-w-2xl mx-auto bg-white rounded-2xl shadow-sm border border-gray-100 p-8">
            <h2 class="text-2xl font-bold mb-6 text-gray-800 border-b pb-4" data-i18n="userProfile">User Profile & Settings</h2>
            
            <form id="settingsForm" onsubmit="saveSettings(event)" class="space-y-5">
                
                <div class="grid grid-cols-1 md:grid-cols-2 gap-5">
                    <div>
                        <label class="block text-sm font-medium text-gray-700 mb-1" data-i18n="age">Age</label>
                        <input type="number" id="inputAge" required min="1" max="120" class="w-full border-gray-300 rounded-lg shadow-sm focus:border-emerald-500 focus:ring-emerald-500 p-2 border">
                    </div>
                    <div>
                        <label class="block text-sm font-medium text-gray-700 mb-1" data-i18n="gender">Gender</label>
                        <select id="inputGender" class="w-full border-gray-300 rounded-lg shadow-sm focus:border-emerald-500 focus:ring-emerald-500 p-2 border">
                            <option value="male" data-i18n="male">Male</option>
                            <option value="female" data-i18n="female">Female</option>
                        </select>
                    </div>
                </div>

                <div class="grid grid-cols-1 md:grid-cols-2 gap-5">
                    <div>
                        <label class="block text-sm font-medium text-gray-700 mb-1" data-i18n="height">Height (cm)</label>
                        <input type="number" id="inputHeight" required min="50" max="300" class="w-full border-gray-300 rounded-lg shadow-sm focus:border-emerald-500 focus:ring-emerald-500 p-2 border">
                    </div>
                    <div>
                        <label class="block text-sm font-medium text-gray-700 mb-1" data-i18n="weight">Weight (kg)</label>
                        <input type="number" id="inputWeight" required min="10" max="300" step="0.1" class="w-full border-gray-300 rounded-lg shadow-sm focus:border-emerald-500 focus:ring-emerald-500 p-2 border">
                    </div>
                </div>

                <div>
                    <label class="block text-sm font-medium text-gray-700 mb-1" data-i18n="activity">Activity Level</label>
                    <select id="inputActivity" class="w-full border-gray-300 rounded-lg shadow-sm focus:border-emerald-500 focus:ring-emerald-500 p-2 border">
                        <option value="1.2" data-i18n="sedentary">Sedentary (little or no exercise)</option>
                        <option value="1.375" data-i18n="lightlyActive">Lightly active (light exercise/sports 1-3 days/week)</option>
                        <option value="1.55" data-i18n="moderatelyActive">Moderately active (moderate exercise/sports 3-5 days/week)</option>
                        <option value="1.725" data-i18n="veryActive">Very active (hard exercise/sports 6-7 days a week)</option>
                    </select>
                </div>

                <div>
                    <label class="block text-sm font-medium text-gray-700 mb-1" data-i18n="goal">Goal</label>
                    <select id="inputGoal" class="w-full border-gray-300 rounded-lg shadow-sm focus:border-emerald-500 focus:ring-emerald-500 p-2 border">
                        <option value="-500" data-i18n="loseWeight">Lose Weight (-500 kcal)</option>
                        <option value="0" data-i18n="maintainWeight">Maintain Weight</option>
                        <option value="500" data-i18n="gainWeight">Gain Weight (+500 kcal)</option>
                    </select>
                </div>

                <div class="pt-4 border-t border-gray-100">
                    <label class="block text-sm font-medium text-gray-700 mb-1" data-i18n="apiKey">Gemini API Key (Optional for real AI, blank for mock)</label>
                    <input type="password" id="inputApiKey" placeholder="AIzaSy..." class="w-full border-gray-300 rounded-lg shadow-sm focus:border-emerald-500 focus:ring-emerald-500 p-2 border">
                    <p class="text-xs text-gray-500 mt-1" data-i18n="apiHint">Needed for actual image analysis. Stored locally.</p>
                </div>

                <div class="pt-4 flex justify-end">
                    <button type="submit" class="bg-emerald-600 hover:bg-emerald-700 text-white font-medium py-2 px-6 rounded-lg shadow-md transition" data-i18n="saveSettingsBtn">Save Settings</button>
                </div>
            </form>
        </div>

    </main>

    <!-- Human-in-the-Loop Modal -->
    <div id="aiModal" class="hidden fixed inset-0 bg-black bg-opacity-50 z-50 flex items-center justify-center p-4 backdrop-blur-sm">
        <div class="bg-white rounded-2xl shadow-xl w-full max-w-md overflow-hidden transform transition-all">
            <div class="bg-emerald-600 p-4 text-white flex justify-between items-center">
                <h3 class="font-bold text-lg" data-i18n="verifyAI">Verify AI Analysis</h3>
                <button onclick="closeModal()" class="text-emerald-100 hover:text-white"><i class="fa-solid fa-xmark text-xl"></i></button>
            </div>
            
            <div class="p-6 space-y-4">
                <div class="flex justify-center mb-4">
                    <img id="modalPreviewImg" src="" alt="Preview" class="h-32 w-32 object-cover rounded-lg shadow border border-gray-200">
                </div>
                
                <div>
                    <label class="block text-sm font-medium text-gray-700 mb-1" data-i18n="foodName">Food Name</label>
                    <input type="text" id="modalName" class="w-full border-gray-300 rounded-lg p-2 border focus:border-emerald-500 focus:ring-emerald-500">
                </div>
                
                <div class="grid grid-cols-2 gap-4">
                    <div>
                        <label class="block text-sm font-medium text-gray-700 mb-1" data-i18n="calories">Calories (kcal)</label>
                        <input type="number" id="modalCalories" class="w-full border-gray-300 rounded-lg p-2 border focus:border-emerald-500 focus:ring-emerald-500">
                    </div>
                    <div>
                        <label class="block text-sm font-medium text-gray-700 mb-1" data-i18n="carbs">Carbs (g)</label>
                        <input type="number" id="modalCarbs" class="w-full border-gray-300 rounded-lg p-2 border focus:border-emerald-500 focus:ring-emerald-500">
                    </div>
                    <div>
                        <label class="block text-sm font-medium text-gray-700 mb-1" data-i18n="protein">Protein (g)</label>
                        <input type="number" id="modalProtein" class="w-full border-gray-300 rounded-lg p-2 border focus:border-emerald-500 focus:ring-emerald-500">
                    </div>
                    <div>
                        <label class="block text-sm font-medium text-gray-700 mb-1" data-i18n="fat">Fat (g)</label>
                        <input type="number" id="modalFat" class="w-full border-gray-300 rounded-lg p-2 border focus:border-emerald-500 focus:ring-emerald-500">
                    </div>
                </div>
                
                <div class="flex space-x-3 pt-4">
                    <button onclick="closeModal()" class="flex-1 bg-gray-100 text-gray-700 py-2 rounded-lg font-medium hover:bg-gray-200 transition" data-i18n="cancel">Cancel</button>
                    <button onclick="saveMealFromModal()" class="flex-1 bg-emerald-600 text-white py-2 rounded-lg font-medium hover:bg-emerald-700 transition shadow-sm" data-i18n="saveMeal">Save Meal</button>
                </div>
            </div>
        </div>
    </div>

    <script>
        // --- i18n Definitions ---
        const translations = {
            'en': {
                appTitle: 'NutriTrack AI', dashboard: 'Dashboard', settings: 'Settings',
                calories: 'Calories', kcal: 'kcal', target: 'Target', macros: 'Macronutrients',
                carbs: 'Carbs', protein: 'Protein', fat: 'Fat', todaysMeals: 'Today\'s Meals',
                addMeal: 'Add Meal', analyzing: 'Analyzing food with AI...', noMeals: 'No meals logged yet. Upload a photo to start!',
                userProfile: 'User Profile & Settings', age: 'Age', gender: 'Gender', male: 'Male', female: 'Female',
                height: 'Height (cm)', weight: 'Weight (kg)', activity: 'Activity Level',
                sedentary: 'Sedentary (little or no exercise)', lightlyActive: 'Lightly active (1-3 days/wk)',
                moderatelyActive: 'Moderately active (3-5 days/wk)', veryActive: 'Very active (6-7 days/wk)',
                goal: 'Goal', loseWeight: 'Lose Weight (-500 kcal)', maintainWeight: 'Maintain Weight', gainWeight: 'Gain Weight (+500 kcal)',
                apiKey: 'Gemini API Key (Optional for real AI, blank for mock)', apiHint: 'Needed for actual image analysis. Stored locally.',
                saveSettingsBtn: 'Save Settings', verifyAI: 'Verify AI Analysis', foodName: 'Food Name',
                cancel: 'Cancel', saveMeal: 'Save Meal', errorParsing: 'Error parsing AI response. Please try again.'
            },
            'zh-TW': {
                appTitle: 'AI 營養追蹤', dashboard: '儀表板', settings: '設定',
                calories: '熱量', kcal: '大卡', target: '目標', macros: '三大營養素',
                carbs: '碳水', protein: '蛋白質', fat: '脂肪', todaysMeals: '今日飲食',
                addMeal: '新增餐點', analyzing: 'AI 正在分析食物...', noMeals: '尚未記錄餐點，上傳照片開始吧！',
                userProfile: '個人資料與設定', age: '年齡', gender: '性別', male: '男', female: '女',
                height: '身高 (cm)', weight: '體重 (kg)', activity: '活動量',
                sedentary: '久坐 (幾乎不運動)', lightlyActive: '輕度活動 (每週1-3天)',
                moderatelyActive: '中度活動 (每週3-5天)', veryActive: '高度活動 (每週6-7天)',
                goal: '目標', loseWeight: '減重 (-500 大卡)', maintainWeight: '維持體重', gainWeight: '增重 (+500 大卡)',
                apiKey: 'Gemini API Key (若為空則使用模擬數據)', apiHint: '用於真實影像分析，僅儲存於本地。',
                saveSettingsBtn: '儲存設定', verifyAI: '確認 AI 分析結果', foodName: '食物名稱',
                cancel: '取消', saveMeal: '儲存餐點', errorParsing: '解析 AI 回應失敗，請重試。'
            }
        };

        // --- State Variables ---
        let currentLang = 'zh-TW';
        let profile = JSON.parse(localStorage.getItem('nutriProfile')) || null;
        let meals = JSON.parse(localStorage.getItem('nutriMeals')) || [];
        let targets = { calories: 0, carbs: 0, protein: 0, fat: 0 };
        let calorieChartInstance = null;
        
        // Temp storage for modal
        let tempMealData = null;

        // --- STREAMING_CHUNK:Initialization and UI Updates ---
        window.onload = () => {
            initLanguage();
            if (!profile) {
                switchView('settings');
            } else {
                populateSettingsForm();
                calculateTargets();
                switchView('dashboard');
            }
        };

        function initLanguage() {
            const savedLang = localStorage.getItem('nutriLang') || 'zh-TW';
            document.getElementById('langSelect').value = savedLang;
            changeLanguage(savedLang);
        }

        function changeLanguage(lang) {
            currentLang = lang;
            localStorage.setItem('nutriLang', lang);
            document.querySelectorAll('[data-i18n]').forEach(el => {
                const key = el.getAttribute('data-i18n');
                if (translations[lang] && translations[lang][key]) {
                    el.innerText = translations[lang][key];
                }
            });
            // Re-render chart if it exists to update labels
            if(calorieChartInstance) updateDashboard();
        }

        function switchView(viewName) {
            const vDashboard = document.getElementById('viewDashboard');
            const vSettings = document.getElementById('viewSettings');
            
            if (viewName === 'dashboard') {
                if (!profile) {
                    alert(currentLang === 'en' ? 'Please complete your profile first.' : '請先完成個人設定。');
                    return;
                }
                vDashboard.classList.remove('hidden');
                vSettings.classList.add('hidden');
                updateDashboard();
            } else {
                vDashboard.classList.add('hidden');
                vSettings.classList.remove('hidden');
            }
        }

        // --- STREAMING_CHUNK:Settings & Calculations ---
        function saveSettings(e) {
            e.preventDefault();
            profile = {
                age: parseInt(document.getElementById('inputAge').value),
                gender: document.getElementById('inputGender').value,
                height: parseFloat(document.getElementById('inputHeight').value),
                weight: parseFloat(document.getElementById('inputWeight').value),
                activity: parseFloat(document.getElementById('inputActivity').value),
                goal: parseInt(document.getElementById('inputGoal').value),
                apiKey: document.getElementById('inputApiKey').value.trim()
            };
            localStorage.setItem('nutriProfile', JSON.stringify(profile));
            calculateTargets();
            switchView('dashboard');
        }

        function populateSettingsForm() {
            if(!profile) return;
            document.getElementById('inputAge').value = profile.age;
            document.getElementById('inputGender').value = profile.gender;
            document.getElementById('inputHeight').value = profile.height;
            document.getElementById('inputWeight').value = profile.weight;
            document.getElementById('inputActivity').value = profile.activity;
            document.getElementById('inputGoal').value = profile.goal;
            document.getElementById('inputApiKey').value = profile.apiKey || '';
        }

        function calculateTargets() {
            if (!profile) return;
            // Mifflin-St Jeor Equation
            let bmr = (10 * profile.weight) + (6.25 * profile.height) - (5 * profile.age);
            bmr += (profile.gender === 'male') ? 5 : -161;
            
            let tdee = bmr * profile.activity;
            let targetCals = Math.round(tdee + profile.goal);
            
            // Ensure minimum safe calories (e.g., 1200)
            if (targetCals < 1200) targetCals = 1200;

            // Default Macro Ratios: 40% Carbs, 30% Protein, 30% Fat
            // 1g Carb = 4kcal, 1g Protein = 4kcal, 1g Fat = 9kcal
            targets = {
                calories: targetCals,
                carbs: Math.round((targetCals * 0.4) / 4),
                protein: Math.round((targetCals * 0.3) / 4),
                fat: Math.round((targetCals * 0.3) / 9)
            };
        }

        // --- STREAMING_CHUNK:Dashboard UI Rendering ---
        function updateDashboard() {
            let totals = { calories: 0, carbs: 0, protein: 0, fat: 0 };
            
            meals.forEach(m => {
                totals.calories += parseInt(m.calories) || 0;
                totals.carbs += parseInt(m.carbs) || 0;
                totals.protein += parseInt(m.protein) || 0;
                totals.fat += parseInt(m.fat) || 0;
            });

            // Update Texts
            document.getElementById('calsConsumedText').innerText = totals.calories;
            document.getElementById('calsTargetText').innerText = targets.calories;
            
            document.getElementById('carbsConsumed').innerText = totals.carbs;
            document.getElementById('carbsTarget').innerText = targets.carbs;
            document.getElementById('proteinConsumed').innerText = totals.protein;
            document.getElementById('proteinTarget').innerText = targets.protein;
            document.getElementById('fatConsumed').innerText = totals.fat;
            document.getElementById('fatTarget').innerText = targets.fat;

            // Update Progress Bars
            const updateBar = (id, consumed, target) => {
                let percent = (consumed / target) * 100;
                if(percent > 100) percent = 100;
                document.getElementById(id).style.width = percent + '%';
            };
            
            // Wait slightly for DOM if just unhidden
            setTimeout(() => {
                updateBar('barCarbs', totals.carbs, targets.carbs);
                updateBar('barProtein', totals.protein, targets.protein);
                updateBar('barFat', totals.fat, targets.fat);
            }, 50);

            // Chart.js Update
            renderChart(totals.calories, targets.calories);
            
            // Render Meal List
            renderMealList();
        }

        function renderChart(consumed, target) {
            const ctx = document.getElementById('calorieChart').getContext('2d');
            let remaining = target - consumed;
            if (remaining < 0) remaining = 0;
            
            const labelConsumed = currentLang === 'zh-TW' ? '已攝取' : 'Consumed';
            const labelRemaining = currentLang === 'zh-TW' ? '剩餘' : 'Remaining';

            if (calorieChartInstance) {
                calorieChartInstance.data.datasets[0].data = [consumed, remaining];
                calorieChartInstance.data.labels = [labelConsumed, labelRemaining];
                calorieChartInstance.update();
                return;
            }

            calorieChartInstance = new Chart(ctx, {
                type: 'doughnut',
                data: {
                    labels: [labelConsumed, labelRemaining],
                    datasets: [{
                        data: [consumed, remaining],
                        backgroundColor: ['#10b981', '#f3f4f6'], // Emerald 500, Gray 100
                        borderWidth: 0,
                        hoverOffset: 4
                    }]
                },
                options: {
                    responsive: true,
                    maintainAspectRatio: false,
                    cutout: '75%',
                    plugins: {
                        legend: { display: false },
                        tooltip: {
                            callbacks: {
                                label: function(context) {
                                    return ' ' + context.label + ': ' + context.raw + ' kcal';
                                }
                            }
                        }
                    }
                }
            });
        }

        function renderMealList() {
            const listEl = document.getElementById('mealList');
            const emptyEl = document.getElementById('emptyMealState');
            
            listEl.innerHTML = '';
            
            if (meals.length === 0) {
                emptyEl.classList.remove('hidden');
                return;
            }
            
            emptyEl.classList.add('hidden');
            
            // Render backwards (newest first)
            [...meals].reverse().forEach((meal, index) => {
                // actual index in main array
                const realIndex = meals.length - 1 - index;
                
                const item = document.createElement('div');
                item.className = 'flex items-center p-3 bg-gray-50 rounded-xl border border-gray-100 hover:shadow-md transition';
                
                item.innerHTML = `
                    <img src="${meal.image}" alt="Meal" class="w-16 h-16 object-cover rounded-lg mr-4 border border-gray-200">
                    <div class="flex-grow">
                        <h4 class="font-semibold text-gray-800">${meal.name}</h4>
                        <div class="text-xs text-gray-500 mt-1 flex space-x-3">
                            <span>🔥 ${meal.calories} kcal</span>
                            <span>C: ${meal.carbs}g</span>
                            <span>P: ${meal.protein}g</span>
                            <span>F: ${meal.fat}g</span>
                        </div>
                    </div>
                    <button onclick="deleteMeal(${realIndex})" class="text-red-400 hover:text-red-600 p-2 rounded-full transition">
                        <i class="fa-solid fa-trash"></i>
                    </button>
                `;
                listEl.appendChild(item);
            });
        }

        function deleteMeal(index) {
            if(confirm(currentLang === 'zh-TW' ? '確定要刪除這筆紀錄嗎？' : 'Are you sure you want to delete this record?')) {
                meals.splice(index, 1);
                localStorage.setItem('nutriMeals', JSON.stringify(meals));
                updateDashboard();
            }
        }

        // --- STREAMING_CHUNK:AI Image Handling ---
        function handleImageUpload(event) {
            const file = event.target.files[0];
            if (!file) return;

            const reader = new FileReader();
            reader.onload = async function(e) {
                const base64Full = e.target.result;
                const base64Data = base64Full.split(',')[1]; // Extract just the base64 part
                
                document.getElementById('aiLoadingIndicator').classList.remove('hidden');
                document.getElementById('emptyMealState').classList.add('hidden');
                
                // Clear input so same file can be selected again
                document.getElementById('mealImageInput').value = '';

                try {
                    const analysis = await analyzeImage(base64Data, file.type);
                    showModal(analysis, base64Full);
                } catch (error) {
                    console.error("Analysis error:", error);
                    alert(translations[currentLang].errorParsing);
                } finally {
                    document.getElementById('aiLoadingIndicator').classList.add('hidden');
                    if(meals.length === 0) document.getElementById('emptyMealState').classList.remove('hidden');
                }
            };
            reader.readAsDataURL(file);
        }

        async function analyzeImage(base64Data, mimeType) {
            // Strict Anti-hallucination Prompt
            const prompt = `Analyze this food image. STRICT RULE: ONLY identify foods visibly present in the image. DO NOT hallucinate or assume components that are not visible (e.g., if only chicken is shown, DO NOT add vegetables or rice). 
            Estimate the nutritional value. 
            Respond ONLY with a valid, raw JSON object containing these keys exactly (no markdown formatting, no code blocks): 
            { "name": "Food Name string", "calories": number, "carbs": number, "protein": number, "fat": number }`;

            if (!profile.apiKey || profile.apiKey.trim() === '') {
                // Mock Analysis fallback if no API key
                return new Promise(resolve => {
                    setTimeout(() => {
                        resolve({
                            name: currentLang === 'zh-TW' ? '未命名食物 (模擬)' : 'Unknown Food (Mock)',
                            calories: Math.floor(Math.random() * 400) + 100,
                            carbs: Math.floor(Math.random() * 50) + 10,
                            protein: Math.floor(Math.random() * 30) + 5,
                            fat: Math.floor(Math.random() * 20) + 5
                        });
                    }, 1500);
                });
            }

            // Real Gemini API Call
            const url = `https://generativelanguage.googleapis.com/v1beta/models/gemini-3.1-flash-preview:generateContent?key=${profile.apiKey}`;
            const payload = {
                contents: [{
                    parts: [
                        { text: prompt },
                        { inlineData: { mimeType: mimeType, data: base64Data } }
                    ]
                }],
                generationConfig: {
                    responseMimeType: "application/json"
                }
            };

            const response = await fetch(url, {
                method: 'POST',
                headers: { 'Content-Type': 'application/json' },
                body: JSON.stringify(payload)
            });

            if (!response.ok) {
                throw new Error('API request failed');
            }

            const result = await response.json();
            const textContent = result.candidates[0].content.parts[0].text;
            
            // Clean markdown blocks if present (though responseMimeType should prevent this)
            let cleanText = textContent.replace(/```json/g, '').replace(/```/g, '').trim();
            return JSON.parse(cleanText);
        }

        // --- STREAMING_CHUNK:Modal Handling ---
        function showModal(data, imageBase64) {
            tempMealData = { image: imageBase64 };
            
            document.getElementById('modalPreviewImg').src = imageBase64;
            document.getElementById('modalName').value = data.name || '';
            document.getElementById('modalCalories').value = data.calories || 0;
            document.getElementById('modalCarbs').value = data.carbs || 0;
            document.getElementById('modalProtein').value = data.protein || 0;
            document.getElementById('modalFat').value = data.fat || 0;

            document.getElementById('aiModal').classList.remove('hidden');
        }

        function closeModal() {
            document.getElementById('aiModal').classList.add('hidden');
            tempMealData = null;
        }

        function saveMealFromModal() {
            if (!tempMealData) return;

            const meal = {
                id: Date.now().toString(),
                image: tempMealData.image,
                name: document.getElementById('modalName').value || (currentLang === 'en' ? 'Unknown' : '未知'),
                calories: parseInt(document.getElementById('modalCalories').value) || 0,
                carbs: parseInt(document.getElementById('modalCarbs').value) || 0,
                protein: parseInt(document.getElementById('modalProtein').value) || 0,
                fat: parseInt(document.getElementById('modalFat').value) || 0,
                timestamp: new Date().toISOString()
            };

            meals.push(meal);
            localStorage.setItem('nutriMeals', JSON.stringify(meals));
            
            closeModal();
            updateDashboard();
        }

    </script>
</body>
</html>
